name: Deploy

# Syncs each agent in agents/ to the Managed Agents API:
#
#   - push to main → deploys to staging, runs session-mode smoke evals against
#     the just-shipped version, prints the returned platform IDs in the step
#     summary so they can be copied back into agent.yaml manually.
#   - workflow_dispatch with environment=production → promotes to production
#     (gated by the GitHub "production" Environment), with auto-rollback on
#     smoke-eval failure.
#
# Smoke evals exercise the live runtime via /v1/sessions, so they require the
# agent to have already been synced. Set rollback_to_version to roll forward
# from a previous version without touching the environment.
#
# Platform IDs are NOT committed back automatically — doing so would require
# a fine-grained PAT to bypass branch protection. After the first deploy of
# an agent to a workspace, copy the printed IDs into agents/<id>/agent.yaml
# under platform.<env>.* and merge that as a normal PR. Subsequent deploys
# read those IDs and update the existing resources in place.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      agent:
        description: 'Specific agent (defaults to all)'
        required: false
      rollback_to_version:
        description: 'Numeric version OR "previous". Empty = normal sync.'
        required: false

permissions:
  contents: read
  deployments: write
  id-token: write # Anthropic Workload Identity Federation

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}-${{ github.event.inputs.agent || 'all' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'staging' }}
      AGENT: ${{ github.event.inputs.agent || '' }}
      ROLLBACK_TO_VERSION: ${{ github.event.inputs.rollback_to_version || '' }}
    steps:
      - uses: actions/checkout@v6

      # Anthropic credential provisioning via Workload Identity Federation.
      # vars.ANTHROPIC_* must be configured per GitHub Environment so each
      # env targets the right Anthropic workspace.
      - uses: ./.github/actions/claude-managed-agents-pipeline
        with:
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - name: Sync agent + environment
        run: pnpm agents:deploy

      - name: Smoke evals (session mode)
        if: env.ROLLBACK_TO_VERSION == ''
        # Staging smoke evals are informational — resources are already in
        # the workspace by the time we reach this step, so a flaky eval
        # shouldn't block the deploy. Production keeps the gate (and the
        # auto-rollback step below uses `failure()` to fire when this step
        # actually fails — we only relax for staging).
        continue-on-error: ${{ env.DEPLOY_ENV != 'production' }}
        env:
          MIN_PASS_RATE: ${{ env.DEPLOY_ENV == 'production' && '0.95' || '0.85' }}
        run: pnpm agents:evals --agent="$AGENT" --mode=session

      - name: Auto-rollback on production failure
        if: failure() && env.DEPLOY_ENV == 'production' && env.ROLLBACK_TO_VERSION == ''
        env:
          ROLLBACK_TO_VERSION: previous
        run: pnpm agents:deploy

      - name: Print platform IDs for manual update
        # Runs on success AND on failure, so partial IDs from a mid-deploy
        # crash are still visible. The deploy script writes IDs to the
        # runner's working copy of agent.yaml; this step surfaces the diff
        # in the job log and the step summary. Copy these into
        # agents/<id>/agent.yaml under platform.<env>.* in a follow-up PR
        # so subsequent deploys update the existing resources instead of
        # creating duplicates.
        if: success() || failure()
        run: |
          set -euo pipefail
          if git diff --quiet -- 'agents/**/agent.yaml'; then
            echo "No platform ID changes — nothing to copy back."
            exit 0
          fi
          echo "Platform ID changes from this deploy (copy into agent.yaml manually):"
          git diff -- 'agents/**/agent.yaml'
          {
            echo "## Platform IDs to copy into \`agent.yaml\`"
            echo ""
            echo "The deploy script wrote these IDs to the runner's working copy of \`agent.yaml\`. They are **not** committed back to the repo automatically — copy them into \`agents/<id>/agent.yaml\` under \`platform.${DEPLOY_ENV}.*\` in a follow-up PR. Subsequent deploys will then update the existing managed agent / environment in place instead of creating new resources."
            echo ""
            echo '```diff'
            git diff -- 'agents/**/agent.yaml'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
