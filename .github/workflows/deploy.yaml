name: Deploy

# Syncs each agent in agents/ to the Managed Agents API:
#
#   - push to main → deploys to staging, runs session-mode smoke evals against
#     the just-shipped version, commits returned platform IDs back to main.
#   - workflow_dispatch with environment=production → promotes to production
#     (gated by the GitHub "production" Environment), with auto-rollback on
#     smoke-eval failure.
#
# Smoke evals exercise the live runtime via /v1/sessions, so they require the
# agent to have already been synced. Set rollback_to_version to roll forward
# from a previous version without touching the environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      agent:
        description: 'Specific agent (defaults to all)'
        required: false
      rollback_to_version:
        description: 'Numeric version OR "previous". Empty = normal sync.'
        required: false

permissions:
  contents: write # commit returned platform IDs back
  deployments: write
  id-token: write # Anthropic Workload Identity Federation (vars.SECRET_PROVIDER=anthropic-wif)

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}-${{ github.event.inputs.agent || 'all' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'staging' }}
      AGENT: ${{ github.event.inputs.agent || '' }}
      ROLLBACK_TO_VERSION: ${{ github.event.inputs.rollback_to_version || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # PIPELINE_PUSH_TOKEN is a fine-grained PAT scoped to Contents:
          # read+write on this repo. We need it because the "Commit platform
          # IDs back" step pushes directly to main, which has branch
          # protection with required status checks. The default GITHUB_TOKEN
          # is rejected by that rule; an admin-owned PAT bypasses (because
          # branch protection has enforce_admins: false).
          # Falls back to GITHUB_TOKEN if the secret isn't set so external
          # consumers without a PAT still get a coherent failure mode.
          token: ${{ secrets.PIPELINE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # Anthropic credential provisioning. Set vars.SECRET_PROVIDER to
      # `anthropic-wif` for keyless OIDC federation, or leave it unset to
      # fall back to GitHub Secrets. See docs/credentials.md for AWS /
      # Vault / Azure / 1Password / LastPass paths.
      - uses: ./.github/actions/claude-managed-agents-pipeline
        with:
          secret-provider: ${{ vars.SECRET_PROVIDER || 'github' }}
          # WIF inputs (used when secret-provider=anthropic-wif). Both
          # vars.ANTHROPIC_FEDERATION_RULE_ID and vars.ANTHROPIC_*_ID
          # should be configured per environment in repo settings.
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # GitHub Secrets fallback (used when secret-provider=github).
          github-secrets-json: '{"ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"}'

      - name: Sync agent + environment
        run: pnpm agents:deploy

      - name: Smoke evals (session mode)
        if: env.ROLLBACK_TO_VERSION == ''
        # Staging smoke evals are informational — resources are already in
        # the workspace by the time we reach this step, so a flaky eval
        # shouldn't block the deploy. Production keeps the gate (and the
        # auto-rollback step below uses `failure()` to fire when this step
        # actually fails — we only relax for staging).
        continue-on-error: ${{ env.DEPLOY_ENV != 'production' }}
        env:
          MIN_PASS_RATE: ${{ env.DEPLOY_ENV == 'production' && '0.95' || '0.85' }}
        run: pnpm agents:evals --agent="$AGENT" --mode=session

      - name: Auto-rollback on production failure
        if: failure() && env.DEPLOY_ENV == 'production' && env.ROLLBACK_TO_VERSION == ''
        env:
          ROLLBACK_TO_VERSION: previous
        run: pnpm agents:deploy

      - name: Commit platform IDs back
        # Run on success AND on failure, so partial IDs from a mid-deploy
        # crash get persisted to main. Without this, the NEXT deploy sees
        # null IDs in agent.yaml and creates fresh resources, orphaning
        # the agents/environments the previous run already created.
        if: success() || failure()
        run: |
          set -euo pipefail
          if git diff --quiet -- 'agents/**/agent.yaml'; then
            echo "No platform ID changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'agents/**/agent.yaml'
          git commit -m "chore(deploy): record managed agent IDs (${DEPLOY_ENV}) [skip ci]"
          git pull --rebase origin main
          git push
