name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Monday morning sweep

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write # Anthropic Workload Identity Federation (per-job)

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning runs as a GitHub-managed feature: enable
  # `secret_scanning` and `secret_scanning_push_protection` under repo
  # Settings → Code security. No workflow needed.

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          # v2 dropped the `--skip-git` flag (skipping git history is the
          # default now). Anything else here keeps working unchanged.
          scan-args: |-
            --recursive
            ./

  # CodeQL runs in its own auto-generated workflow ("CodeQL"), which has the
  # right `actions: read` permission for the telemetry / results-upload step.
  # We don't duplicate it here.

  prompt-injection-red-team:
    name: Prompt-injection red team
    # Skip on Dependabot PRs — no agent-prompt changes, no API key access.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/claude-managed-agents-pipeline
        with:
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - name: Run red team
        env:
          MAX_BREACH_RATE: ${{ vars.MAX_BREACH_RATE }}
        run: pnpm agents:injection-test --mode=messages

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: injection-results-${{ github.sha }}
          path: .eval-results/injection/
          retention-days: 30

  security-summary:
    name: Security summary
    needs: [osv-scan, prompt-injection-red-team]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Roll up
        run: |
          {
            echo "## Security gate"
            echo "- osv-scan: ${{ needs.osv-scan.result }}"
            echo "- prompt-injection-red-team: ${{ needs.prompt-injection-red-team.result }}"
            echo "- codeql: GitHub-managed (separate CodeQL workflow)"
            echo "- secret scanning: GitHub-managed (Settings → Code security)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Security gate failed."
            exit 1
          fi
