name: 'Claude Managed Agents Pipeline'
description: >
  CI bootstrap for the Claude Managed Agents Pipeline. Installs pnpm
  dependencies and (when needed) exchanges the workflow's GitHub OIDC
  token for a short-lived Anthropic access token via Workload Identity
  Federation. No long-lived API key in the repo. Pass
  `provision-anthropic-credentials: false` for jobs that don't call
  Claude (lint, typecheck, build, tests). Relies on Node + corepack
  preinstalled on ubuntu-latest; the pnpm version is pinned via
  `packageManager` in package.json.

inputs:
  provision-anthropic-credentials:
    description: >-
      Exchange the GitHub OIDC token for an Anthropic access token. Set to
      'false' for jobs that don't call Claude (lint, typecheck, build,
      tests). When 'true' (default), requires the four ANTHROPIC_*
      federation IDs to be passed in.
    required: false
    default: 'true'
  anthropic-organization-id:
    description: 'Anthropic organization UUID. Settings → Organization in the Console.'
    required: false
  anthropic-service-account-id:
    description: 'Anthropic service account ID `svac_…`.'
    required: false
  anthropic-federation-rule-id:
    description: 'Anthropic federation rule ID `fdrl_…`. Typically scoped per Workspace; pass via env-scoped vars.'
    required: false
  anthropic-workspace-id:
    description: 'Anthropic workspace ID `wrkspc_…`. Required when the federation rule is scoped to a specific workspace (non-default). Pass via env-scoped vars.'
    required: false
  anthropic-oidc-audience:
    description: "Audience claim to request from GitHub OIDC. Must match the federation rule's `audience`."
    required: false
    default: 'https://api.anthropic.com'

runs:
  using: 'composite'
  steps:
    # The action lives at <repo>/.github/actions/claude-managed-agents-pipeline.
    # Three levels up from `${{ github.action_path }}` gets us the repo root.
    - name: Resolve pipeline repo root
      id: pipeline-root
      shell: bash
      run: echo "dir=$(cd "${{ github.action_path }}/../../.." && pwd)" >> "$GITHUB_OUTPUT"

    # actions/setup-node and actions/cache run their own JavaScript on the
    # runner's built-in Node. Opt into Node.js 24 now so the job doesn't emit
    # deprecation warnings (Node 20 for actions is removed in Sep 2026).
    - name: Opt into Node.js 24 for actions
      shell: bash
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

    # Pin Node 22 for pipeline scripts — matches the engines field in
    # package.json and keeps pnpm from emitting "Unsupported engine" warnings.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles(format('{0}/pnpm-lock.yaml', steps.pipeline-root.outputs.dir)) }}
        restore-keys: ${{ runner.os }}-pnpm-

    - name: Install pipeline dependencies
      shell: bash
      working-directory: ${{ steps.pipeline-root.outputs.dir }}
      env:
        # Skip corepack's "Do you want to download this version?" prompt on first use.
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable pnpm
        pnpm install --frozen-lockfile

    # ─────────────────────────────────────────────────────────
    # Anthropic Workload Identity Federation
    # ─────────────────────────────────────────────────────────
    - name: Anthropic WIF — fetch GitHub OIDC + exchange for access token
      if: inputs.provision-anthropic-credentials == 'true'
      shell: bash
      env:
        AUDIENCE: ${{ inputs.anthropic-oidc-audience }}
        FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
        ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
        WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
      run: |
        set -euo pipefail
        if [ -z "${FEDERATION_RULE_ID:-}" ] || [ -z "${ORGANIZATION_ID:-}" ] || [ -z "${SERVICE_ACCOUNT_ID:-}" ]; then
          echo "::error::WIF requires anthropic-federation-rule-id, anthropic-organization-id, and anthropic-service-account-id."
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::GitHub OIDC token unavailable — set permissions: id-token: write at the workflow or job level."
          exit 1
        fi
        # Log ID prefixes so a 401 from the exchange tells us which IDs the
        # rule expects vs. what we sent. Org UUID is non-secret. Rule and
        # SA IDs are non-secret per Anthropic's Console (visible to all
        # org members). We log the first 12 chars to make obvious typos
        # findable without dumping full identifiers.
        echo "Federation request IDs (first 12 chars):"
        echo "  organization_id    = ${ORGANIZATION_ID:0:12}…  (full length=${#ORGANIZATION_ID})"
        echo "  service_account_id = ${SERVICE_ACCOUNT_ID:0:12}…  (full length=${#SERVICE_ACCOUNT_ID})"
        echo "  federation_rule_id = ${FEDERATION_RULE_ID:0:12}…  (full length=${#FEDERATION_RULE_ID})"

        echo "::group::Fetching GitHub OIDC token (audience=$AUDIENCE)"
        JWT=$(curl -fsS \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
          | jq -r .value)
        if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
          echo "::error::Empty OIDC token from GitHub."
          exit 1
        fi
        # Decode the JWT payload (no signature check — diagnostics only) so
        # the workflow log shows what claims the token carries. This makes
        # rule-match misses self-diagnosing.
        PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | tr -d '\n')
        # base64 needs padding to a multiple of 4
        case $(( ${#PAYLOAD} % 4 )) in
          2) PAYLOAD="${PAYLOAD}==" ;;
          3) PAYLOAD="${PAYLOAD}=" ;;
        esac
        DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null || true)
        echo "JWT claims (subset):"
        echo "$DECODED" | jq '{iss, aud, sub, repository, repository_owner, ref, environment, event_name, workflow}' 2>/dev/null || echo "  (could not decode)"
        echo "::endgroup::"

        echo "::group::Exchanging JWT for Anthropic access token"
        # Don't use curl -f: we want the response body even on HTTP errors so
        # we can surface Anthropic's error_description. Capture status
        # separately via -w.
        REQ_BODY=$(jq -n \
          --arg jwt "$JWT" \
          --arg rule "$FEDERATION_RULE_ID" \
          --arg org "$ORGANIZATION_ID" \
          --arg sa "$SERVICE_ACCOUNT_ID" \
          --arg ws "${WORKSPACE_ID:-}" \
          '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer", assertion:$jwt, federation_rule_id:$rule, organization_id:$org, service_account_id:$sa} + (if $ws != "" then {workspace_id:$ws} else {} end)')
        RESPONSE=$(curl -sS -w "\n__STATUS__%{http_code}" \
          https://api.anthropic.com/v1/oauth/token \
          -H "content-type: application/json" \
          --data "$REQ_BODY")
        STATUS=$(echo "$RESPONSE" | awk -F'__STATUS__' '/__STATUS__/{print $2}')
        BODY=$(echo "$RESPONSE" | sed '$ d')
        if [ "$STATUS" != "200" ]; then
          echo "::error::Federation exchange returned HTTP $STATUS"
          echo "Response body:"
          echo "$BODY"
          exit 1
        fi
        ACCESS_TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')
        if [ -z "$ACCESS_TOKEN" ]; then
          echo "::error::Federation exchange returned 200 but no access_token"
          echo "Response body:"
          echo "$BODY"
          exit 1
        fi
        EXPIRES=$(echo "$BODY" | jq -r '.expires_in')
        echo "::add-mask::$ACCESS_TOKEN"
        echo "ANTHROPIC_AUTH_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
        echo "Acquired Anthropic access token (expires in ${EXPIRES}s, scoped to service account ${SERVICE_ACCOUNT_ID})."
        echo "::endgroup::"
